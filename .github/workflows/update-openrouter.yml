name: Update OpenRouter Data

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch but do not commit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# NOTE on data regimes:
#   • The historical daily panel (assets/data/panel_final.csv.gz +
#     the time-series in openrouter_data.js) is FROZEN at 2026-05-05.
#     OpenRouter removed the per-model daily RSC feed that fed extend_panel.py,
#     so that pipeline (extend_panel.py + generate_viz.py) is no longer run.
#   • Live weekly market share comes from fetch_rankings.py, which talks to the
#     OpenRouter /rankings server actions and self-heals the rotating action IDs.
#   • update_openrouter.py still refreshes live pricing for price_vs_intelligence.

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── Step 1: fetch live weekly market share (fail-loud) ───────────────────
      - name: Fetch live rankings
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python scripts/fetch_rankings.py $ARGS

      # ── Step 2: refresh live model prices for the (frozen) price scatter ─────
      - name: Refresh live model prices
        if: github.event.inputs.dry_run != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/update_openrouter.py

      # ── Step 3: commit if anything changed ───────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- assets/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- assets/
          fi

      - name: Commit and push
        if: |
          steps.changes.outputs.changed == 'true' &&
          github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/rankings_live.js assets/data/rankings_raw.json assets/js/openrouter_data.js
          git commit -m "auto: refresh live OpenRouter market share [$(date -u +'%Y-%m-%d')]"
          git push
